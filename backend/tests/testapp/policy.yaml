# Test-only app: proves the foundation enforces roles, scope, masking and approvals from YAML alone (FND-2).
app: testapp
name: Test App
permissions:
  - widget.read
  - widget.read_unmasked
  - widget.request
  - widget.approve
  - audit.read
masking:
  profiles:
    standard:
      owner_name: initials
      id_number: last4
      address: city_only
      born_on: day_only
roles:
  viewer:
    label: Viewer
    permissions: [widget.read]
    scope: { field: region, attribute: regions }
    masking: standard
  requester:
    label: Requester
    permissions: [widget.read, widget.request]
    scope: all
    masking: standard
  manager:
    label: Manager
    permissions: [widget.read, widget.read_unmasked, widget.approve, audit.read]
    scope: all
    masking: none
approvals:
  approve:
    distinct_from: [requested_by, approvals.approver_id]
    count:
      default: 1
      rules:
        - when: { field: amount, gt: 1000 }
          then: 2
